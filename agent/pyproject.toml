[project]
name = "soro-agent"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "livekit-agents>=1.8.13",
    "livekit-api>=1.2.3",
    "livekit-plugins-groq>=1.8.13",
    "livekit-plugins-silero>=1.8.13",
    "livekit-plugins-spitch>=1.8.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
