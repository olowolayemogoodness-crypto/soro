[project]
name = "soro-api"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "livekit-api>=1.0",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyjwt>=2.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
